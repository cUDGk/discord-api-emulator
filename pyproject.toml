[project]
name = "dapi-emu"
version = "0.1.0"
description = "Offline Discord Bot API emulator"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dapi_emu"]

[tool.ruff]
line-length = 110
target-version = "py311"
